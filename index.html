<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flux Vélorutionnaire</title>
  <link rel="manifest" href="manifest.json">
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js?v2').then(reg => {
        console.log('Service Worker enregistré', reg);
      }).catch(err => {
        console.error('Échec du SW', err);
      });
    });
  }
</script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #111 0%, #222 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      padding: 30px;
      background: rgba(255,255,255,0.05);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    h1 { margin-bottom: 15px; font-size: clamp(24px,5vw,32px); color: #4fc3f7; }
    p { margin-bottom: 30px; line-height: 1.6; color: #ccc; font-size: clamp(14px,3vw,16px); }
    .controls { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
    .control-btn {
      width: 70px; height: 70px; border-radius: 50%; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px;
      transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    #listenBtn { background: linear-gradient(135deg, #00c853 0%, #64dd17 100%); color: white; }
    #stopBtn { background: linear-gradient(135deg, #ff5252 0%, #ff8a80 100%); color: white; }
    .control-btn:disabled { background: #555; cursor: not-allowed; transform: none !important; box-shadow: none !important; opacity: 0.5; }
    #status { margin-top: 20px; font-weight: bold; min-height: 24px; padding: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; font-size: clamp(14px,3vw,16px); transition: all 0.3s ease; }
    #status.playing { color: #00c853; background: rgba(0,200,83,0.1); }
    #status.error { color: #ff5252; background: rgba(255,82,82,0.1); }
    .hidden-audio { position: fixed; opacity: 0; pointer-events: none; width: 0; height: 0; }
    .radio-icon { font-size: 60px; margin-bottom: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @media (max-width: 768px) { .container { padding: 20px; margin: 10px; } .controls { gap: 15px; } .radio-icon { font-size: 50px; } }
    @media (max-width: 480px) { body { padding: 10px; } .container { padding: 15px; } .radio-icon { font-size: 40px; } }
  </style>
</head>
<body>
  <div class="container">
    <img src="../logo.png" style="width:40%" />
    <h1>Écouter le flux live</h1>
    <p>Clique sur le bouton Play pour te connecter à la diffusion en direct.</p>
    <div class="controls">
      <button id="listenBtn" class="control-btn" title="Démarrer l'écoute"> ▶ </button>
      <button id="stopBtn" class="control-btn" disabled title="Arrêter l'écoute">⏹</button>
    </div>
    <div id="status">Prêt à écouter</div>
  </div>

<audio
  id="hiddenAudio"
  autoplay
  playsinline
  controls
  style="width:1px;height:1px;opacity:0.01;position:fixed;bottom:0;right:0;">
</audio>

<script type="module" src="script.js?v10"></script>
</body>
</html>
